# GitLab CI version of the pipeline in .github/workflows/train-model.yml.
#
# The project is hosted on GitHub, so the workflow that really runs is the
# GitHub Actions one. This file is the same pipeline written for GitLab, and it
# was tested locally with gitlab-ci-local (see README.md).
#
# Like the GitHub workflow, it stores no AWS key. GitLab gives the job a short
# lived token and AWS exchanges it for temporary credentials.

stages:
  - train

train-model:
  stage: train
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]

  # GitLab creates this token for the job. AWS trusts it through the same
  # kind of OIDC provider that is used for GitHub.
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com

  variables:
    AWS_REGION: us-east-1

  script:
    - |
      set -euo pipefail

      # In GitLab the job gets an OIDC token and exchanges it for temporary
      # credentials. When the file is run locally with gitlab-ci-local there is
      # no such token, so the credentials of the local profile are used instead.
      if [ -n "${GITLAB_OIDC_TOKEN:-}" ]; then
        echo "Exchanging the GitLab token for temporary AWS credentials"
        CREDENTIALS=$(aws sts assume-role-with-web-identity \
          --role-arn "$AWS_ROLE_ARN" \
          --role-session-name gitlab-ci-train-model \
          --web-identity-token "$GITLAB_OIDC_TOKEN" \
          --duration-seconds 3600 \
          --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
          --output text)
        export AWS_ACCESS_KEY_ID=$(echo "$CREDENTIALS" | cut -f1)
        export AWS_SECRET_ACCESS_KEY=$(echo "$CREDENTIALS" | cut -f2)
        export AWS_SESSION_TOKEN=$(echo "$CREDENTIALS" | cut -f3)
      else
        echo "No OIDC token, using the credentials from the environment"
      fi
    - |
      set -euo pipefail

      INPUT=$(printf '{"source":"gitlab-ci","commit":"%s","rows":150}' "$CI_COMMIT_SHORT_SHA")
      echo "Input: $INPUT"

      EXECUTION_ARN=$(aws stepfunctions start-execution \
        --state-machine-arn "$STATE_MACHINE_ARN" \
        --name "train-$(date +%s)" \
        --input "$INPUT" \
        --query executionArn --output text)

      echo "Started: $EXECUTION_ARN"

      for attempt in $(seq 1 30); do
        STATUS=$(aws stepfunctions describe-execution \
          --execution-arn "$EXECUTION_ARN" --query status --output text)
        echo "Attempt $attempt: $STATUS"
        [ "$STATUS" != "RUNNING" ] && break
        sleep 5
      done

      echo "Result of the pipeline:"
      aws stepfunctions describe-execution \
        --execution-arn "$EXECUTION_ARN" --query output --output text

      if [ "$STATUS" != "SUCCEEDED" ]; then
        echo "The pipeline finished with status $STATUS"
        exit 1
      fi

  rules:
    - if: $CI_COMMIT_BRANCH == "lesson-10"
