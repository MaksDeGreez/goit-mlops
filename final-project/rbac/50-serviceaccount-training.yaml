# The account the training Job runs as.
#
# It has no RoleBinding, because the job never talks to the Kubernetes API: it
# reads the CSV baked into its image and sends everything else to MLflow over
# HTTP. The account exists so the Job does not use the "default" account of the
# namespace, which every other pod there shares. Its token is not mounted.
#
# The "mlflow" account of the same namespace is NOT here. The MLflow chart
# creates it (serviceAccount.name: mlflow) and Terraform attaches an EKS Pod
# Identity to it for the artifact bucket. Two owners for one object would mean
# ArgoCD and the chart fighting over it on every sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training
  namespace: mlops-system
  labels:
    app.kubernetes.io/name: training
    app.kubernetes.io/part-of: mlops-final
automountServiceAccountToken: false
