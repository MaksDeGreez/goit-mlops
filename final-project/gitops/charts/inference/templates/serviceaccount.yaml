{{/*
The service does not talk to the Kubernetes API, so its account has no
RoleBinding and its token is not mounted. It exists only so the pods do not run
with the "default" account of the namespace, which is shared with everything
else that is deployed there.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "inference.name" . }}
  labels:
    {{- include "inference.labels" . | nindent 4 }}
automountServiceAccountToken: false
