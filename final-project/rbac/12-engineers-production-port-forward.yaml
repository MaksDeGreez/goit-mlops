# Ask one production pod what it is serving - "curl /info" through a tunnel -
# without a shell inside the container.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-engineers-port-forward
  namespace: production
  labels:
    app.kubernetes.io/part-of: mlops-final
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlops-final-port-forward
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: mlops-engineers
