# GitLab CI version of .github/workflows/final-project-ci.yml.
#
# The project is hosted on GitHub, so the pipeline that really runs is the
# GitHub Actions one. This file is the same pipeline written for GitLab and it
# was tested locally with gitlab-ci-local.
#
# GitLab expects the CI file in the root of the repository. To use this one,
# set "CI/CD configuration file" in Settings -> CI/CD -> General pipelines to
# final-project/.gitlab-ci.yml.

stages:
  - lint
  - test
  - build
  - secret-scan

# Every job runs on the same branches. GitLab has no "paths" filter on the
# pipeline itself, so the rules are repeated through this anchor.
.on_the_project_branches: &on_the_project_branches
  rules:
    - if: $CI_COMMIT_BRANCH == "final-project"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pre-commit:
  stage: lint
  # The image already contains Python 3.13 and uv, and it is built for both
  # amd64 and arm64.
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim

  variables:
    TERRAFORM_VERSION: "1.15.5"
    # Keep the hook environments inside the project so GitLab can cache them.
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"

  cache:
    key: pre-commit-$TERRAFORM_VERSION
    paths:
      - .cache/pre-commit

  before_script:
    - |
      set -eu

      # git is needed by pre-commit, unzip by the Terraform download.
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends ca-certificates curl git unzip

      # The terraform fmt hook calls the terraform binary, so install it.
      ARCH=$(dpkg --print-architecture)
      curl -fsSL -o /tmp/terraform.zip \
        "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_${ARCH}.zip"
      unzip -q -o /tmp/terraform.zip -d /usr/local/bin
      terraform version

      # gitlab-ci-local copies the files without the git history, so give
      # pre-commit a repository to work with.
      git config --global --add safe.directory "$CI_PROJECT_DIR"
      git rev-parse --git-dir >/dev/null 2>&1 || {
        git init -q .
        git add -A
      }

  script:
    - uv sync --locked --project final-project
    - uv run --project final-project pre-commit run --all-files --show-diff-on-failure

  <<: *on_the_project_branches


tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim

  # One job per service, the same four the GitHub matrix builds.
  parallel:
    matrix:
      - SERVICE: [training, inference, registry-ops, drift-monitor]

  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

  cache:
    key: uv-$SERVICE
    paths:
      - .cache/uv

  script:
    - cd "final-project/services/$SERVICE"
    # --locked fails if the lock file does not match pyproject.toml.
    - uv sync --locked
    - uv run pytest -q

  <<: *on_the_project_branches


build-and-scan:
  stage: build
  # NOT tested on the development machine: gitlab-ci-local cannot start the
  # docker-in-docker service a GitLab runner gives this job. The steps are the
  # same ones the GitHub workflow runs, and those were tested.
  image: docker:29-cli
  services:
    - docker:29-dind

  parallel:
    matrix:
      - SERVICE: [training, inference, registry-ops, drift-monitor]

  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    TRIVY_VERSION: "0.74.0"
    IMAGE: "final-project/$SERVICE:$CI_COMMIT_SHA"

  before_script:
    # Shared GitLab runners are amd64. The scanner is a single binary, and
    # installing it here lets it talk to the same daemon that built the image.
    - apk add --no-cache curl tar
    - curl -fsSL
      "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      | tar -xz -C /usr/local/bin trivy
    - trivy --version

  script:
    - cd final-project
    - docker build -f "services/$SERVICE/Dockerfile" -t "$IMAGE" .
    - test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = "10001"
    # A report only, see the comment in the GitHub workflow.
    - trivy image --quiet --scanners vuln --ignore-unfixed --severity HIGH
      --format table "$IMAGE"
    - trivy image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL
      --exit-code 1 --format table "$IMAGE"
    # The push to ECR goes here once the registry exists.

  <<: *on_the_project_branches


secret-scan:
  stage: secret-scan
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    # The image starts gitleaks itself, and GitLab needs a shell instead.
    entrypoint: [""]

  script:
    # The pre-commit hook only sees the changes that are being committed, so
    # in CI it would find nothing. Only the paths of this project are scanned:
    # the graded homework folders hold demo credentials that were committed on
    # purpose, and an allowlist for them could also hide a real key here.
    - gitleaks dir final-project --no-banner --redact --exit-code 1
    - gitleaks dir .github/workflows --no-banner --redact --exit-code 1

  <<: *on_the_project_branches
