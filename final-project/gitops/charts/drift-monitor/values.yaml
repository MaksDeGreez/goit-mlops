# Default values of the drift-monitor chart.
#
# Flat keys, like the inference chart. There is only one environment for this
# job (namespace mlops-system), so these defaults are also the real settings;
# the ArgoCD Application only adds the three addresses below.

# --- values the ArgoCD Application injects -----------------------------------
# The ECR registry host. It contains the AWS account id, so it stays out of
# this repository. Rendering fails when it is missing.
imageRegistry: ""
lokiUrl: http://loki.monitoring.svc.cluster.local:3100
pushgatewayUrl: http://pushgateway.monitoring.svc.cluster.local:9091

# --- the job -------------------------------------------------------------------
# The CI pipeline builds one image per commit and tags it with the full 40
# character commit sha. There is only one environment for this job, so the tag
# lives here instead of in an envs/ file. The value below is a short sha from a
# local build and is replaced during the first deployment.
imageTag: 3c95938
# Every 15 minutes. The window below is an hour, so runs overlap on purpose:
# a short spike is seen four times instead of being missed once.
schedule: "*/15 * * * *"

# The prediction log lines of the production pods. The labels come from Grafana
# Alloy, which turns the pod label app.kubernetes.io/name into "app".
lokiQuery: '{namespace="production", app="inference"} | json | event="prediction"'
windowMinutes: 60
lokiLimit: 5000
# Below this many rows the job pushes only the row count and exits. 400 was
# measured: with fewer rows PSI on the long tailed columns of this dataset
# starts reporting drift that is not there.
minSamples: 400
pushJob: drift_monitor
# Empty means the file inside the image, /app/data/reference.csv.
referencePath: ""

# --- resources ---------------------------------------------------------------
# A measured run over 2500 rows used 287 MiB and took 3 seconds. Nearly all of
# it is pandas and Evidently being imported, so the number hardly changes with
# the number of rows.
cpuRequest: 200m
memoryRequest: 320Mi
cpuLimit: ""
memoryLimit: 640Mi

# --- job behaviour ---------------------------------------------------------------
# One try is enough: the next run is 15 minutes away, and a job that cannot
# reach Loki will not be able to a minute later either.
backoffLimit: 1
activeDeadlineSeconds: 600
# A run is skipped rather than queued when the cluster was busy.
startingDeadlineSeconds: 300
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
