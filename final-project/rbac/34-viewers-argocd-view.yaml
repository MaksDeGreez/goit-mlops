# Read the ArgoCD Applications, so a reviewer can see what git asked for and
# whether the cluster agrees.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewers-view
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: mlops-final
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlops-final-viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: viewers
