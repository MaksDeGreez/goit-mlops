{{/*
The job talks to Loki and to the PushGateway over HTTP and never to the
Kubernetes API, so this account has no rights and no mounted token. It only
keeps the job off the shared "default" account of the namespace.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "drift-monitor.name" . }}
  labels:
    {{- include "drift-monitor.labels" . | nindent 4 }}
automountServiceAccountToken: false
