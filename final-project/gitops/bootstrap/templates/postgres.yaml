# PostgreSQL, wave 0.
#
# Plain manifests, so this is a directory source and not a chart. MLflow in
# wave 1 waits for the database with an init container, but the wave still
# gives it a head start.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: {{ .Values.argocdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: {{ .Values.basePath }}/gitops/apps/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespaces.platform }}
  {{- include "bootstrap.syncPolicy" (dict) | nindent 2 }}
