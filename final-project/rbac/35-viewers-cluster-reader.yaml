metadata:
  name: viewers-cluster-reader
  labels:
    app.kubernetes.io/part-of: mlops-final
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlops-final-cluster-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: viewers
