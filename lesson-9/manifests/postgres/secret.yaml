# Demo credentials only.
#
# The password is in Git because this cluster is created for one exercise and
# destroyed again afterwards, and the database is only reachable from inside the
# cluster. A real project would keep it out of Git with Sealed Secrets, the
# External Secrets Operator or AWS Secrets Manager, and Argo CD would read it
# from there.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: mlflow
type: Opaque
stringData:
  POSTGRES_DB: mlflow
  POSTGRES_USER: mlflow
  POSTGRES_PASSWORD: mlflow-demo-password
