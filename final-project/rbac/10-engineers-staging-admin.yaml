# Staging belongs to the engineers: deploy, delete, exec into a pod, read the
# Secrets. This is the "full access to staging" half of the assignment.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-engineers-admin
  namespace: staging
  labels:
    app.kubernetes.io/part-of: mlops-final
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlops-final-namespace-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: mlops-engineers
