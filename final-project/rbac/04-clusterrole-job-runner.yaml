# What the Step Functions state machine needs to run a training job.
#
# The "eks:runJob.sync" integration creates a Job, waits for it to finish and,
# with RetrieveLogs on, reads the logs of the pods that Job made. It needs no
# eks:* permission in IAM at all: this role, plus the EKS access entry
# Terraform creates for the state machine role, is the whole permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mlops-final-job-runner
  labels:
    app.kubernetes.io/part-of: mlops-final
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
