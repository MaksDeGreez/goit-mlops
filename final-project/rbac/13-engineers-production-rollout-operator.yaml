# Stop a canary that is going wrong, or let a good one through early. See
# 03-clusterrole-rollout-operator.yaml for why this is allowed while
# "patch rollouts" is not.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-engineers-rollout-operator
  namespace: production
  labels:
    app.kubernetes.io/part-of: mlops-final
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlops-final-rollout-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: mlops-engineers
